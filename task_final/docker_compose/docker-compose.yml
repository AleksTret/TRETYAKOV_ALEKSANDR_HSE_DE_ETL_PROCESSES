services:
  # PostgreSQL 
  postgres:
    image: postgres:14
    container_name: de-postgres
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
      - ./data:/opt/airflow/data
    networks:
      - etl-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # MongoDB
  mongodb:
    image: mongo:6
    container_name: de-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - etl-network
    restart: unless-stopped

  # Инициализация Airflow
  airflow-init:
    image: apache/airflow:2.9.3
    container_name: de-airflow-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW_CONN_MONGO_DEFAULT: 'mongodb://mongodb:27017'
      AIRFLOW_CONN_POSTGRES_ETL: 'postgresql://airflow:airflow@postgres:5432/etl_warehouse'
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./scripts:/opt/airflow/scripts
      - ./data:/opt/airflow/data
    networks:
      - etl-network
    command: >
      bash -c "
      airflow db init &&
      airflow users create -r Admin -u admin -f Admin -l User -p admin --email admin@example.com &&
      airflow connections add 'postgres_etl' --conn-type 'postgres' --conn-host 'postgres' --conn-schema 'etl_warehouse' --conn-login 'airflow' --conn-password 'airflow' --conn-port '5432' &&
      echo 'Airflow инициализирован'
      "
    restart: "no"

  # Веб-сервер Airflow
  airflow-webserver:
    image: apache/airflow:2.9.3
    container_name: de-airflow-web
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
      AIRFLOW_CONN_MONGO_DEFAULT: 'mongodb://mongodb:27017'
      AIRFLOW_CONN_POSTGRES_ETL: 'postgresql://airflow:airflow@postgres:5432/etl_warehouse'
      _PIP_ADDITIONAL_REQUIREMENTS: "pymongo==4.16.0 apache-airflow-providers-mongo==4.2.2 Faker==37.12.0 pandas==2.1.4"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./scripts:/opt/airflow/scripts
      - ./data:/opt/airflow/data
    ports:
      - "8080:8080"
    networks:
      - etl-network
    command: webserver
    healthcheck:
      test: ["CMD", "airflow", "db", "check"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  # Планировщик Airflow
  airflow-scheduler:
    image: apache/airflow:2.9.3
    container_name: de-airflow-scheduler
    depends_on:
      airflow-webserver:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW_CONN_MONGO_DEFAULT: 'mongodb://mongodb:27017'
      AIRFLOW_CONN_POSTGRES_ETL: 'postgresql://airflow:airflow@postgres:5432/etl_warehouse'
      _PIP_ADDITIONAL_REQUIREMENTS: "pymongo==4.16.0 apache-airflow-providers-mongo==4.2.2 Faker==37.12.0 pandas==2.1.4"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./scripts:/opt/airflow/scripts
      - ./data:/opt/airflow/data
    networks:
      - etl-network
    command: scheduler
    restart: unless-stopped

  # Генератор данных
  data-generator:
    image: python:3.9-slim
    container_name: de-data-generator
    depends_on:
      mongodb:
        condition: service_started
    networks:
      - etl-network
    volumes:
      - ./scripts:/scripts
      - ./data:/data
    command: >
      bash -c "
      pip install --no-cache-dir pymongo Faker &&
      python /scripts/generate_data.py
      "
    restart: "no"

networks:
  etl-network:
    driver: bridge

volumes:
  postgres_data:
  mongo_data: